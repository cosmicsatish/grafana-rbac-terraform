adaptive_editor:
  description: Access and manage Adaptive Metrics/Logs for the team only.
  permissions:
    # General Plugin Access
    plugins:grafana-adaptivelogs-app:plugin-access: ''
    plugins:grafana-adaptive-metrics-app:plugin-access: ''
    
    # Adaptive Metrics (Restricted to Segment)
    plugins:grafana-adaptive-metrics-app:rules-editor: 'segments:*'
    plugins:grafana-adaptive-metrics-app:exemptions-editor: 'segments:*'
    plugins:grafana-adaptive-metrics-app:segments-reader: 'segments:*'
    
    # Adaptive Logs (Restricted to Segment)
    plugins:grafana-adaptivelogs-app:patterns-editor: 'segments:*'
    
    # Standard Viewer permissions
    fixed:datasources:explorer: ''
    fixed:dashboards:reader: ''
    fixed:folders:reader: ''


